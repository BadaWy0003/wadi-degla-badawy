# fly.toml app configuration file generated for client-rough-dawn-8020 on 2025-01-08T23:55:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'client-rough-dawn-8020'
primary_region = 'cdg'

[build]
  # Ensure Fly builds the app before serving
  builder = "paketobuildpacks/builder:base"

[env]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ["app"]

[[http_service.redirects]]
  from = "wadidegla-eg.com"
  to = "https://www.wadidegla-eg.com"
  status_code = 301

[[http_service.domains]]
  domain = "wadidegla-eg.com"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024