map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    ~.+ $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Redirect bare root to /en/ - use forwarded scheme to keep https
    location = / {
        return 301 $forwarded_scheme://$host/en/;
    }

    # Static assets: long cache
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML pages: no-cache (important for i18n + deployments)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Root-level static files must be served directly, not redirected to /en/
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Main SPA catch-all: serve directory index.html
    # Next.js static export with trailingSlash creates /path/index.html
    location / {
        # Redirect paths not starting with a supported lang prefix to /en/
        if ($uri !~ ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)(/|$)) {
            return 301 /en$uri;
        }
        # Try exact file, then directory index, then 404
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page
    error_page 404 /en/page-not-found/index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
