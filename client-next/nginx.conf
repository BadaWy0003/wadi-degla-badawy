map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    ~.+ $http_x_forwarded_proto;
}

# Redirect non-www to www
server {
    listen 80;
    server_name wadidegla-eg.com;
    return 301 https://www.wadidegla-eg.com$request_uri;
}

server {
    listen 80;
    server_name www.wadidegla-eg.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Send relative Location headers so redirects keep the visitor's https
    # (behind Fly, nginx itself only sees plain http)
    absolute_redirect off;

    # Old product addresses -> new ones, in every language (2026-11: spelling fixes,
    # the Nero Marquinaa duplicate, and names that ended in a space).
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/botccino-classico/?$ /$1/products/botticino-classico/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/traventine-beige/?$ /$1/products/travertine-beige/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/turkish-cararra/?$ /$1/products/turkish-carrara/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/embrador-light/?$ /$1/products/emperador-light/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/embrador-medium/?$ /$1/products/emperador-medium/ permanent;
    # Silvia is not sold (owner, 2026-11-05): old Silvia addresses go to the Egyptian marble page
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/silvia/?$ /$1/egyptian-marble/ permanent;
    rewrite ^/products/silvia/?$ /en/egyptian-marble/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/nero-marquinaa/?$ /$1/products/nero-marquina/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/oriental-white-/?$ /$1/products/oriental-white/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/border-beige-/?$ /$1/products/border-beige/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/breccia-daino-/?$ /$1/products/breccia-daino/ permanent;
    # Stones renamed in the admin panel (2026-11-24): Triesta Beige -> Beige Sinai Pearl, Triesta Grey -> Dark Sinai Pearl
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/triesta-beige/?$ /$1/products/beige-sinai-pearl/ permanent;
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/triesta-grey/?$ /$1/products/dark-sinai-pearl/ permanent;
    # Semi-precious and exotic stones no longer sold (removed from the admin panel): their old
    # addresses go to the Imported marble page, the closest category (owner, 2026-11-25;
    # Search Console listed them as 404 in every language).
    rewrite ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)/products/(green-onyx|ocean-jasper|tiger-eye|petrified-wood-retro|azul-macauba|brown-agate|coffee-wood|indian-onyx|lady-grey|yellow-quartz|beige-onyx)/?$ /$1/imported-marble/ permanent;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Files on our own domain (website audit, 2026-11-25). nginx fetches them and passes them on;
    # if that fails, the visitor is sent to the file's own address, so a download never breaks.
    # Spec sheet PDFs: /files/spec-sheets/<stone id>.pdf?lang=en|ar, from the API over Fly's
    # private network (fdaa::3 is Fly's internal DNS). The visitor's IP goes along as
    # X-WD-Visitor-IP so the API's download limit still counts per visitor (rate-limit.middleware.js).
    location ~ "^/files/spec-sheets/([A-Za-z0-9_-]{1,40})\.pdf$" {
        set $wd_sheet $1;
        resolver [fdaa::3] valid=60s ipv6=on;
        resolver_timeout 3s;
        set $wd_api http://server-withered-wildflower-1595.internal:3000;
        proxy_pass $wd_api/api/storage/spec-sheet/$wd_sheet$is_args$args;
        proxy_set_header Host server-withered-wildflower-1595.internal;
        proxy_set_header Fly-Client-IP "";
        proxy_set_header X-WD-Visitor-IP $http_fly_client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @wd_sheet_direct;
    }
    location @wd_sheet_direct {
        return 302 https://server-withered-wildflower-1595.fly.dev/api/storage/spec-sheet/$wd_sheet$is_args$args;
    }
    # PDFs uploaded in the admin panel (Website → Company: company profile, catalogue), kept in
    # Storage at uploads/Site/files/.
    location ^~ /uploads/Site/files/ {
        resolver [fdaa::3] 1.1.1.1 valid=300s;
        resolver_timeout 3s;
        set $wd_storage storage.googleapis.com;
        proxy_pass https://$wd_storage/wadi-degla-app.firebasestorage.app$uri;
        proxy_set_header Host storage.googleapis.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name storage.googleapis.com;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @wd_file_direct;
    }
    location @wd_file_direct {
        return 302 https://storage.googleapis.com/wadi-degla-app.firebasestorage.app$uri;
    }

    # Old addresses: /index.html (served the bare root redirect page) and pages
    # of the pre-2024 ASP.NET site (Default.aspx, ...) go to the home page.
    location = /index.html {
        return 301 /en/;
    }
    location ~* \.aspx$ {
        return 301 /en/;
    }

    # Redirect bare root to /en/ - use forwarded scheme to keep https
    location = / {
        return 301 $forwarded_scheme://$host/en/;
    }

    # Next.js build files: their names change with every build (content hash), so they
    # can be cached forever.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers (repeated here: nginx drops server-level add_header
        # in any location that sets its own headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Other static files (photos under /Assets, icons, fonts...) keep the same name when
    # replaced, so cache them for 30 days and let browsers re-check (ETag) after that.
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        # Security headers (repeated here: nginx drops server-level add_header
        # in any location that sets its own headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # HTML pages: no-cache (important for i18n + deployments)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Security headers (repeated here: nginx drops server-level add_header
        # in any location that sets its own headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Root-level static files must be served directly, not redirected to /en/
    location ~ ^/(image-)?sitemap\.xml$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Security headers (repeated here: nginx drops server-level add_header
        # in any location that sets its own headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Security headers (repeated here: nginx drops server-level add_header
        # in any location that sets its own headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Main SPA catch-all: serve directory index.html
    # Next.js static export with trailingSlash creates /path/index.html
    location / {
        # Redirect paths not starting with a supported lang prefix to /en/
        if ($uri !~ ^/(en|ar|fr|es|de|it|ro|ko|sq|ru|ja|zh)(/|$)) {
            return 301 /en$uri;
        }
        # Try exact file, then directory index, then 404
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page
    error_page 404 /en/page-not-found/index.html;

    # Security headers for responses from locations without their own add_header
    # (redirects, 404s). Keep in sync with the copies in the locations above.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
