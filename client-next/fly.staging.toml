# Staging website: same code, built against the staging server, hidden from Google
# (noindex) and without Google Analytics. Reachable only at its fly.dev address.
# Deployed only by .github/workflows/deploy-staging.yml (manual "Run workflow").

app = 'wadi-degla-site-staging'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_BASE_API_URL = "https://wadi-degla-server-staging.fly.dev"
    NEXT_PUBLIC_SITE_ENV = "staging"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
