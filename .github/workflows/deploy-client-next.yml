name: Deploy client-next to Fly.io

on:
  push:
    branches:
      - nextjs-migration
    paths:
      - 'client-next/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy client-next
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-client-next
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: client-next
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NEXT_API_TOKEN }}
        run: |
          # Create app if it doesn't exist yet
          flyctl apps list | grep -q "client-next-wadi-degla" || \
            flyctl apps create --name client-next-wadi-degla

          # NEXT_PUBLIC_ vars must be passed at build time (they are baked into the JS bundle)
          flyctl deploy --remote-only -a client-next-wadi-degla \
            --build-arg NEXT_PUBLIC_BASE_API_URL=https://server-withered-wildflower-1595.fly.dev
