name: Deploy client-next to Fly.io

# Manual only (owner's choice, 2026-11-18): merging to main does NOT deploy, to save GitHub
# build minutes. Deploy when the owner says so: GitHub > Actions > this workflow > Run workflow
# (branch main), or Claude starts it (actions_run_trigger).
# The admin panel's "Publish to website" button also starts this workflow (deploys main).
on:
  workflow_dispatch:

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: deploy-client-next
  cancel-in-progress: false

jobs:
  # No separate checks job: the Docker build on Fly runs the same build (and lint), and a
  # failed build never replaces the live site. Saves GitHub build minutes on every merge
  # and every "Publish to website".
  deploy:
    name: Deploy client-next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the sitemap's page dates come from it

      # The Docker build on Fly has no git history, so the page dates for the sitemap
      # (<lastmod>) are written here and copied into the build with the code.
      - name: Page dates for the sitemap
        working-directory: client-next
        run: node scripts/write-git-dates.js

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        working-directory: client-next
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # NEXT_PUBLIC_ vars must be passed at build time (they are baked into the JS bundle).
          # PUBLISH_ID changes every run, so the build step is never reused from the builder's
          # cache: a "Publish to website" with no code change must still fetch the latest
          # news, projects and admin-panel content.
          flyctl deploy --remote-only -a client-next-wadi-degla \
            --build-arg NEXT_PUBLIC_BASE_API_URL=https://server-withered-wildflower-1595.fly.dev \
            --build-arg PUBLISH_ID=${{ github.run_id }}-${{ github.run_attempt }}
