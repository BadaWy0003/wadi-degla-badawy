name: Deploy Admin
# Manual only (owner's choice, 2026-11-18): merging to main does NOT deploy, to save GitHub
# build minutes. Deploy when the owner says so: GitHub > Actions > this workflow > Run workflow
# (branch main), or Claude starts it (actions_run_trigger).
on:
  workflow_dispatch:

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  # No separate checks job: the Docker build on Fly runs the same build (and lint), and a
  # failed build never replaces the live site. Saves GitHub build minutes on every merge
  # and every "Publish to website".
  deploy:
    name: Deploy admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
