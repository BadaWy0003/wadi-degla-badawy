name: Checks

# Runs on every pull request (so problems show up before merging), only for the apps the
# pull request changes. Also reused by the server deploy (a syntax error would not stop its
# Docker build). The website and admin deploys don't call it: their Docker build on Fly runs
# the same build, and a failed build never replaces the live site.
# GitHub bills build minutes for this private repository, so nothing runs twice.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      app:
        description: "client-next | server | admin-dashboard"
        type: string
        required: true

# A newer push to the same pull request stops the older, now useless run.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.app || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which apps the pull request changes (any change under .github/ checks all three).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      client-next: ${{ steps.files.outputs.client-next }}
      server: ${{ steps.files.outputs.server }}
      admin-dashboard: ${{ steps.files.outputs.admin-dashboard }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > files.txt
          for app in client-next server admin-dashboard; do
            if grep -qE "^($app|\.github)/" files.txt; then echo "$app=true" >> "$GITHUB_OUTPUT"; else echo "$app=false" >> "$GITHUB_OUTPUT"; fi
          done

  client-next:
    needs: changes
    if: always() && (inputs.app == 'client-next' || needs.changes.outputs['client-next'] == 'true')
    name: Build website (client-next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as client-next/Dockerfile
          cache: npm
          cache-dependency-path: client-next/package-lock.json
      - run: npm ci
      # next build also runs ESLint and fails on lint errors
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_API_URL: https://server-withered-wildflower-1595.fly.dev

  server:
    needs: changes
    if: always() && (inputs.app == 'server' || needs.changes.outputs.server == 'true')
    name: Check server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same major as server/Dockerfile
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true" # the Docker image uses system Chromium
      # No tests exist yet: at least make sure every file parses.
      - name: Syntax check
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

  admin-dashboard:
    needs: changes
    if: always() && (inputs.app == 'admin-dashboard' || needs.changes.outputs['admin-dashboard'] == 'true')
    name: Build admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as admin-dashboard/Dockerfile
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - name: Build
        # CI=false: CRA would otherwise treat existing lint warnings as errors
        run: npx react-scripts --openssl-legacy-provider build
        env:
          CI: "false"
          REACT_APP_BASE_API_URL: https://server-withered-wildflower-1595.fly.dev
